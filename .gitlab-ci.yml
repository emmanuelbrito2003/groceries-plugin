stages:
  - test
  - deploy

# Stage de Testing
test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
  script:
    - echo "Verificando que la aplicación funciona..."
    - python -c "from main import app; print('✓ FastAPI se importa correctamente')"
    - python -c "from models import ItemPayload; print('✓ Modelos funcionan correctamente')"
  only:
    - main

# Stage de Deploy a Railway
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl bash
    - curl -fsSL https://railway.app/install.sh | sh
    - export PATH="/root/.railway/bin:$PATH"
  script:
    - echo "Desplegando a Railway..."
    - railway link $RAILWAY_PROJECT_ID
    - railway up --detach
    - echo "✓ Deployment exitoso!"
    - echo "Tu API está disponible en Railway"
  only:
    - main
  environment:
    name: production
    url: https://web-production-9d47f.up.railway.app
