stages:
  - test
  - deploy

# Stage de Testing
test:
  stage: test
  image: python:3.12
  before_script:
    - pip install -r requirements.txt
  script:
    - echo "Verificando que la aplicación funciona..."
    - python -c "from main import app; print('✓ FastAPI se importa correctamente')"
    - python -c "from models import ItemPayload; print('✓ Modelos funcionan correctamente')"
  only:
    - main

# Stage de Deploy a Render
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - echo "Desplegando a Render..."
    - curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" -H "Authorization Bearer ${RENDER_API_KEY}" -H "Content-Type application/json" -d '{"clearCache":"do_not_clear"}' | jq '.'
    - echo "✓ Deployment iniciado exitosamente!"
    - echo "Tu API está disponible en https://groceries-plugin-5h31.onrender.com"
  only:
    - main
  environment:
    name: production
    url: https://groceries-plugin-5h31.onrender.com
